services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MATCHWATCH_OWNER_PASSWORD: ${MATCHWATCH_OWNER_PASSWORD}
      MATCHWATCH_APP_PASSWORD: ${MATCHWATCH_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.40.14
    volumes:
      - ollama:/root/.ollama

  ai:
    profiles: ["ai"]
    build: ./ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-240}
      EXTRACT_DEADLINE_S: ${EXTRACT_DEADLINE_S:-270}
    ports:
      - "127.0.0.1:8090:8090" # dev only: the Go API runs on the host
    depends_on: [ollama]

volumes:
  pgdata:
  ollama:
